# ── Bot identity ─────────────────────────────────────────────────
# GitHub account where forks are created.
# A classic PAT from this account goes into the BOT_PAT secret.
# Scopes: repo and workflow. Without `workflow` the fork cannot be synced past any
# upstream commit that touches .github/workflows/, and GitHub grants `workflow`
# only alongside full `repo`.
bot_org: sea-snake-translation-bot
bot_user: sea-snake-translation-bot
bot_email: sea-snake-translation-bot@users.noreply.github.com

# ── Managed repositories ─────────────────────────────────────────
# Add an entry here to start managing translations for a public repo.
# The bot will automatically fork it and begin creating translation PRs.
repos:
  - repo: dfinity/internet-identity
    # Path to translation files relative to repo root
    locales_path: src/frontend/src/lib/locales
    # File format: po | json | yaml | xliff | arb
    file_format: po
    # Source language code (this file is never translated)
    source_language: en
    # i18n framework hint (helps Claude understand the codebase)
    framework: svelte-lingui
    # Node.js version required by this repo
    node_version: "24"
    # Commands to run in the target repo (leave blank to skip)
    setup: npm install
    extract: npm run extract
    format: npm run format
    # Git branch / PR naming.
    # branch_prefix is the branch name for the combined translation PR (used as-is),
    # and is also the base for derived branches like `<prefix>-context` for context audits.
    branch_prefix: chore/translate
    pr_title_prefix: "chore(fe):"
    # Enable weekly context-audit sweeps (adds translator context to source files)
    context_audit: false
    # Lets the bot fix a defect in this repo's source when no translation can
    # fix it — a count with no plural structure, a sentence split across
    # messages, a message that needs a context. The commits land on the open
    # translation PR, so a human still reviews them.
    escalation:
      enabled: true
      # Path prefixes the escalation may change, besides locales_path.
      # `.github/` is never allowed, whatever is listed here.
      paths:
        - src/frontend/src
        - src/lingui-svelte
      # Caps on one escalation's diff. Over these it reports instead of
      # committing, because a change that size wants a human to open the PR.
      max_files: 8
      max_lines: 300
      # Must pass before anything is committed.
      verify: npx vitest run --config ./vitest.config.ts src/lingui-svelte
    # Source file globs for context audit
    source_paths:
      - src/frontend/src/lib/**/*.svelte
      - src/frontend/src/routes/**/*.svelte
    # Users whose PR feedback the bot will process (everyone else is ignored)
    feedback_allowlist:
      - AntonioVentilii
      - aterga
      - sea-snake
      - marc0olo
      - mducroux
      - Copilot
